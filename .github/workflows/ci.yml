name: CI

on:
  push:
    branches: [main]
  pull_request:

# La suite corre entera en Linux (con Postgres y Chromium) y en Windows (la
# plataforma donde se desarrolla; sin Postgres: esos tests se saltan solos).
# Los canarios de formato (test_canary_*) se saltan sin transcripts reales.
jobs:
  linux:
    name: ubuntu · postgres · chromium
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: magi
          POSTGRES_PASSWORD: magi
          POSTGRES_DB: debate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U magi -d debate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CLAMI_TEST_POSTGRES_DSN: "dbname=debate user=magi password=magi host=localhost port=5432"
      DEBATE_CONNINFO: "dbname=debate user=magi password=magi host=localhost port=5432"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            debate-mcp/requirements.txt
            debate-mcp/requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r debate-mcp/requirements.txt -r debate-mcp/requirements-dev.txt playwright ruff
          python -m playwright install --with-deps chromium
          echo "CLAMI_BROWSER_PATH=$(python -c 'from playwright.sync_api import sync_playwright as sp; p = sp().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
          git config --global user.email "ci@magi.local"
          git config --global user.name "MAGI CI"
      - name: Lint (errores solamente)
        run: ruff check --select E9,F63,F7,F82 debate-mcp memory-graph tests
      - name: Migrate test database
        run: python debate-mcp/schema/migrate.py
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider -rs

  windows:
    name: windows
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            debate-mcp/requirements.txt
            debate-mcp/requirements-dev.txt
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r debate-mcp/requirements.txt -r debate-mcp/requirements-dev.txt playwright ruff
          python -m playwright install chromium
          $chromium = python -c "from playwright.sync_api import sync_playwright as sp; p = sp().start(); print(p.chromium.executable_path); p.stop()"
          "CLAMI_BROWSER_PATH=$chromium" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          git config --global user.email "ci@magi.local"
          git config --global user.name "MAGI CI"
      - name: Lint (errores solamente)
        run: ruff check --select E9,F63,F7,F82 debate-mcp memory-graph tests
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider -rs
